<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NextRealm Movies</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #111;
}

header {
    background: #111;
    color: white;
    padding: 18px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

nav {
    background: #111;
    display: flex;
    gap: 25px;
    overflow-x: auto;
    padding: 12px 15px;
    white-space: nowrap;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.search {
    margin: 15px;
    background: white;
    border-radius: 30px;
    padding: 12px 18px;
    box-shadow: 0 2px 8px #ccc;
}

.search input {
    width: 90%;
    border: none;
    outline: none;
    font-size: 16px;
}

.featured {
    height: 330px;
    background:
        linear-gradient(90deg, #111, transparent),
        url("the-old-guard.jpg") center/cover;
    color: white;
    display: flex;
    align-items: flex-end;
    padding: 25px;
}

.featured h2 {
    font-size: 30px;
    margin: 0;
}

.section {
    padding: 20px 15px;
}

.section h2 {
    margin-bottom: 15px;
}

.categories {
    display: flex;
    gap: 12px;
    overflow-x: auto;
}

.category {
    background: white;
    padding: 12px 22px;
    border-radius: 25px;
    white-space: nowrap;
    box-shadow: 0 2px 6px #ccc;
    font-weight: bold;
}

.movies {
    display: flex;
    gap: 15px;
    overflow-x: auto;
}

.movie {
    min-width: 150px;
    max-width: 150px;
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px #ccc;
}

.movie img {
    width: 100%;
    height: 215px;
    object-fit: cover;
}

.movie-info {
    padding: 10px;
}

.movie-info h3 {
    margin: 0;
    font-size: 15px;
}

.movie-info p {
    margin: 6px 0;
    color: #777;
    font-size: 13px;
}

.movie a {
    display: block;
    background: #111;
    color: white;
    text-align: center;
    padding: 10px;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>NextRealm Movies</h1>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="movies.html">Movies</a>
    <a href="#">African</a>
    <a href="#">Western</a>
    <a href="#">Series</a>
</nav>

<div class="search">
    🔍
    <input type="text" placeholder="Search movies...">
</div>

<section class="featured">

    <div>
        <h2>The Old Guard</h2>
        <p>Action • 2020</p>
    </div>

</section>

<section class="section">

    <h2>🔥 Top Picks</h2>

    <div class="categories">
        <div class="category">🌍 Global</div>
        <div class="category">🎬 Western</div>
        <div class="category">🇳🇬 African</div>
        <div class="category">📺 Series</div>
    </div>

</section>

<section class="section">

    <h2>🎬 Latest Movies & Series</h2>

    <div class="movies">

        <!-- THE OLD GUARD -->

        <div class="movie">

            <img src="the-old-guard.jpg"
                 alt="The Old Guard">

            <div class="movie-info">

                <h3>The Old Guard</h3>

                <p>Movies 1 & 2 • Action</p>

            </div>

            <a href="the-old-guard.html">View</a>

        </div>


        <!-- LIONESS -->

        <div class="movie">

            <img src="lioness.jpg"
                 alt="Lioness">

            <div class="movie-info">

                <h3>Lioness</h3>

                <p>All Seasons • Series</p>

            </div>

            <a href="lioness.html">View</a>

        </div>


        <!-- DAY OF THE DEAD -->

        <div class="movie">

            <img src="day-of-the-dead.jpg"
                 alt="Day of the Dead Bloodline">

            <div class="movie-info">

                <h3>Day of the Dead</h3>

                <p>Bloodline • Horror</p>

            </div>

            <a href="day-of-the-dead.html">View</a>

        </div>

    </div>

</section>

</body>
</html>
