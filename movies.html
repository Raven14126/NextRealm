<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NextRealm Movies</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #111;
}

header {
    background: #111;
    color: white;
    padding: 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

nav {
    background: #111;
    display: flex;
    gap: 22px;
    overflow-x: auto;
    padding: 12px 15px;
    white-space: nowrap;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.search {
    margin: 15px;
    background: white;
    border-radius: 30px;
    padding: 12px 18px;
    box-shadow: 0 2px 8px #ccc;
}

.search input {
    width: 100%;
    border: none;
    outline: none;
    font-size: 16px;
}

.featured {
    height: 380px;
    background: linear-gradient(90deg, #111, transparent),
                url("movie-featured.jpg") center/cover;
    color: white;
    display: flex;
    align-items: flex-end;
    padding: 25px;
}

.featured h2 {
    font-size: 30px;
    margin: 0;
}

.section {
    padding: 20px 15px;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.section-title h2 {
    margin: 0 0 15px;
}

.movies {
    display: flex;
    gap: 15px;
    overflow-x: auto;
}

.movie {
    min-width: 145px;
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px #ccc;
}

.movie img {
    width: 100%;
    height: 205px;
    object-fit: cover;
}

.movie-info {
    padding: 10px;
}

.movie-info h3 {
    margin: 0;
    font-size: 15px;
}

.movie-info p {
    margin: 6px 0 0;
    color: #777;
    font-size: 13px;
}

.movie a {
    display: block;
    background: #111;
    color: white;
    text-align: center;
    padding: 9px;
    text-decoration: none;
    font-weight: bold;
}

.categories {
    display: flex;
    gap: 12px;
    overflow-x: auto;
}

.category {
    background: white;
    padding: 12px 22px;
    border-radius: 25px;
    white-space: nowrap;
    box-shadow: 0 2px 6px #ccc;
    font-weight: bold;
}

@media (max-width: 600px) {
    .featured {
        height: 350px;
    }

    .featured h2 {
        font-size: 26px;
    }
}
</style>
</head>

<body>

<header>
    <h1>NextRealm</h1>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="movies.html">Movies</a>
    <a href="#">African</a>
    <a href="#">Western</a>
    <a href="#">Shorts</a>
</nav>

<div class="search">
    🔍
    <input type="text" placeholder="Search movies...">
</div>

<section class="featured">
    <div>
        <h2>Featured Movie</h2>
        <p>Watch the latest movies on NextRealm</p>
    </div>
</section>

<section class="section">

    <div class="section-title">
        <h2>🔥 Top Picks</h2>
    </div>

    <div class="categories">
        <div class="category">🌍 Global</div>
        <div class="category">🎬 Western</div>
        <div class="category">🇳🇬 African</div>
        <div class="category">🇰🇷 K-Drama</div>
    </div>

</section>

<section class="section">

    <div class="section-title">
        <h2>🎬 Latest Movies</h2>
    </div>

    <div class="movies">

        <div class="movie">
            <img src="movie1.jpg" alt="Movie poster">
            <div class="movie-info">
                <h3>Movie Title One</h3>
                <p>Action • 2026</p>
            </div>
            <a href="movie1.html">View</a>
        </div>

        <div class="movie">
            <img src="movie2.jpg" alt="Movie poster">
            <div class="movie-info">
                <h3>Movie Title Two</h3>
                <p>Drama • 2026</p>
            </div>
            <a href="movie2.html">View</a>
        </div>

        <div class="movie">
            <img src="movie3.jpg" alt="Movie poster">
            <div class="movie-info">
                <h3>Movie Title Three</h3>
                <p>Action • 2026</p>
            </div>
            <a href="movie3.html">View</a>
        </div>

    </div>

</section>

</body>
</html>
